name: bench

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ours:
        description: "Our refs to bench (space separated, e.g. 'v0.1.0 main')"
        default: "HEAD"
      theirs:
        description: "andraantariksa/Anime4K-rs refs (e.g. 'v0.1 v0.2 master')"
        default: "v0.2"

permissions:
  contents: write        # push results to the `bench` branch (main only)
  pull-requests: write   # comment on PRs
  actions: read          # 5-minute cooldown between manual runs

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never kill a run on main, queue it

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # one run takes ~5 min, plus apt retries
    steps:
      # Manual runs need write access (GitHub's own check on "Run workflow"); at most one every 5 minutes.
      - name: Cooldown
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/perf-bench.yml/runs?event=workflow_dispatch&per_page=5"             --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].created_at // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 300 ]; then
            echo "::error::A manual run was started at $last; wait 5 minutes between manual runs."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          # apt sometimes stalls on the runners' mirror: bounded attempts, then the official mirror.
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            timeout 90 sudo apt-get update -qq -o Acquire::Retries=2 &&
            timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=2 ffmpeg mesa-vulkan-drivers unzip >/dev/null && break
            [ $i = 3 ] && exit 1; echo "apt attempt $i failed, switching to archive.ubuntu.com"
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
          done
          rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            bench/.cache/*.jpg
            bench/.cache/shaders
            ~/.cargo/registry
            ~/.cargo/git
          key: bench-inputs-v2

      - name: Tests
        run: |
          python3 bench/bench.py --out /dev/null --frames 0 --ours "" --theirs ""  # only fetches inputs + shaders
          ANIME4K_SHADERS=$PWD/bench/.cache/shaders cargo test --release

      - name: Bench
        env:
          OURS: ${{ github.event_name == 'pull_request' && format('origin/{0} HEAD', github.base_ref) || inputs.ours || 'HEAD' }}
          THEIRS: ${{ inputs.theirs || 'v0.2' }}
        run: |
          for s in clean degraded; do
            python3 bench/bench.py --source $s --out result-$s.json --ours "$OURS" --theirs "$THEIRS"
            python3 bench/render.py result-$s.json --md summary-$s.md --svg bench-$s.svg
          done
          { cat summary-clean.md; echo; echo; cat summary-degraded.md; } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            result-*.json
            bench-*.svg

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md --edit-last --create-if-none

      # The README shows bench/bench.svg from main; pushes made with GITHUB_TOKEN do not re-trigger this workflow.
      - name: Update the README card on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          id="$(date -u +%Y%m%dT%H%M%S)-$(git rev-parse --short HEAD)"
          mkdir -p bench/history bench/history-degraded
          cp result-clean.json "bench/history/$id.json"
          cp result-degraded.json "bench/history-degraded/$id.json"
          cp result-clean.json bench/latest.json            # read by the results page (bench/index.html)
          cp result-degraded.json bench/latest-degraded.json
          python3 bench/render.py result-clean.json --history bench/history --svg bench/bench.svg --md bench/latest.md
          python3 bench/render.py result-degraded.json --history bench/history-degraded --svg bench/bench-degraded.svg --md bench/latest-degraded.md
          git add bench/history bench/history-degraded bench/latest.json bench/latest-degraded.json bench/bench.svg bench/bench-degraded.svg bench/latest.md bench/latest-degraded.md
          git commit -qm "bench: $(git rev-parse --short HEAD) [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
