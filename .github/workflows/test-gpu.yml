name: gpu-engine

# The GPU engine (--moteur libplacebo) against several ffmpeg versions, on Vulkan lavapipe (no GPU on runners).
# Same command lines as on a real GPU: a new ffmpeg that breaks the filter graph turns this red (issue #5).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches a new ffmpeg release without any commit here

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: [distro, release, master]   # Ubuntu 24.04 (6.1), latest BtbN release build, BtbN master
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # apt sometimes stalls on the runners' mirror: bounded attempts, then the official mirror.
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            timeout 90 sudo apt-get update -qq -o Acquire::Retries=2 &&
            timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=2 mesa-vulkan-drivers ${{ matrix.ffmpeg == 'distro' && 'ffmpeg' || '' }} >/dev/null && break
            [ $i = 3 ] && exit 1; echo "apt attempt $i failed, switching to archive.ubuntu.com"
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
          done
          if [ "${{ matrix.ffmpeg }}" != distro ]; then
            pat='^ffmpeg-master-latest-linux64-gpl\.tar\.xz$'
            [ "${{ matrix.ffmpeg }}" = release ] && pat='^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$'
            asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' | grep -E "$pat" | sort -V | tail -1)
            echo "BtbN asset: $asset"
            gh release download latest -R BtbN/FFmpeg-Builds -p "$asset" -O ff.tar.xz
            mkdir ff && tar xf ff.tar.xz -C ff --strip-components=1
            echo "$PWD/ff/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            bench/.cache/shaders
            ~/.cargo/registry
          key: gpu-inputs-v1

      - name: Build
        run: |
          ffmpeg -hide_banner -version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 bench/bench.py --out /dev/null --frames 0 --ours "" --theirs ""  # fetches the shaders only
          cargo build --release
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=320x180:r=24 -t 1 -c:v libx264 -pix_fmt yuv420p clip.mkv

      # Raw filter graphs, to tell which part ffmpeg refuses when the engine fails (never fails the job).
      # The two forms without -init_hw_device always fail on lavapipe (see "GPU engine" below).
      - name: Filter graphs (diagnostic)
        run: |
          # try "<device options>" "<filter graph>"
          try() { if out=$(ffmpeg -hide_banner -v error $1 -f lavfi -i testsrc2=s=320x180 -vf "$2" -frames:v 2 -f null - 2>&1); then r=ok; else r="FAIL: $(echo "$out" | tail -3 | tr '\n' ' ')"; fi; echo "- \`$1 -vf $2\` → $r" | tee -a "$GITHUB_STEP_SUMMARY"; }
          try "-init_hw_device vulkan=vk -filter_hw_device vk" hwupload,libplacebo=w=640:h=360:format=yuv420p10le,hwdownload,format=yuv420p10le
          try "-init_hw_device vulkan=vk:0 -filter_hw_device vk" libplacebo=w=640:h=360:format=yuv420p10le
          try "" libplacebo=w=640:h=360:format=yuv420p10le
          try "" libplacebo=w=640:h=360:format=rgba64le,format=gbrpf32le

      - name: GPU engine
        env:
          ANIME4K_SHADERS: ${{ github.workspace }}/bench/.cache/shaders
        run: |
          a=target/release/anime4k-rs
          $a --lister-gpu
          check() { n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,width,height -of csv=p=0 "$1"); echo "$1: $n"; [ "$n" = "$2" ] || { echo "::error::$1: expected $2, got $n"; exit 1; }; }
          # (bash -e does not stop on a failure inside `a && b`: one command per line)
          $a clip.mkv --moteur libplacebo --preset A --taille S --hauteur 360 --images 3 --sortie out.mkv
          check out.mkv 640,360,3
          $a clip.mkv --gpu 0 --preset C --taille S --hauteur 360 --images 3 --sortie out-gpu0.mkv
          check out-gpu0.mkv 640,360,3
          # Graph refused by ffmpeg (here: no card 7) → the engine retries down to the form without -init_hw_device.
          # Form 3 cannot succeed here: libplacebo will not create its own device on a software Vulkan (lavapipe);
          # it is checked on a real GPU. Here: the retry chain reaches it.
          $a clip.mkv --gpu 7 --preset C --taille S --hauteur 360 --images 3 --sortie out-repli.mkv 2> repli.log || true
          cat repli.log
          grep -q "forme 3" repli.log
          $a clip.mkv --moteur libplacebo --preset A --taille S --hauteur 360 --images 2 --brut --sortie out.raw
          test "$(stat -c %s out.raw)" = $((640 * 360 * 3 * 4 * 2)) || { echo "::error::raw output has the wrong size"; exit 1; }
